# Slide preferences
slides:
  # Number of slides to generate per run
  count: 5
  # Tone: casual, professional, educational, bold
  tone: "bold"
  # Target audience
  audience: "retail investors and finance enthusiasts on TikTok/Instagram"
  # Slide dimensions (16:9 for social media stories, use 9:16 for vertical)
  aspect_ratio: "9:16"
  # Color scheme
  # Color palette preset: premium_gold, neon_finance, money_green, electric
  # Or set custom colors below (overrides preset)
  palette: "premium_gold"
  colors:
    background: "#0D0D15"
    title: "#F0F0F0"
    body: "#C0C0D0"
    accent: "#F7B731"
    highlight: "#FF5757"

# Research preferences
research:
  # Sources to use: news, reddit (comma-separated)
  sources:
    - news
    - reddit
  # Finance topics of interest
  topics:
    - stocks
    - crypto
    - earnings
    - market trends
    - economic indicators
  # Reddit subreddits to scan
  subreddits:
    - wallstreetbets
    - stocks
    - investing
    - stockmarket

# Content generation
content:
  # Number of engagement review iterations
  review_iterations: 2
  # Style notes for the AI
  style_notes: >
    Use short punchy sentences. Include relevant numbers and data points.
    Make it feel urgent and timely. Use hooks that grab attention.
    Each slide should be digestible in under 3 seconds of reading.
    Front-load the most surprising word or number in each sentence.
    Write for sound-off viewers: text must carry the full message visually.

  # TikTok attention optimization
  attention:
    # Enforce 3-second hook rule: slide 1 text must be readable in <3 seconds
    three_second_hook: true
    # Generate visual_hint fields on each slide for design guidance
    visual_hints: true
    # Generate sound mood suggestions in TikTok metadata
    sound_mood: true
    # Generate SEO hook keywords for on-screen text discoverability
    hook_keywords: true

# Canva integration (optional, for alternative AI-designed slides)
# Get credentials at https://www.canva.dev/console → Create integration
canva:
  client_id: ""
  client_secret: ""

# Video generation (optional, requires ElevenLabs API key)
video:
  # ElevenLabs voice ID (default: "Adam" — deep, clear male voice)
  # Run `python -c "from src.slides.video_builder import list_voices; print(list_voices())"` to see options
  voice_id: "pNInz6obpgDQGcFmaJgB"
  # Crossfade duration between slides (seconds)
  crossfade: 0.3
  # Minimum time a slide is shown (seconds)
  min_duration: 4.0
  # Extra silence after voiceover ends per slide (seconds)
  padding: 0.8
  # Use AI-generated background images (requires REPLICATE_API_TOKEN)
  ai_images: false
  # Ken Burns effect: animate background images with zoom/pan motion
  # per slide role (hook=zoom-in, context=pan, payoff=zoom-out, cta=drift)
  ken_burns: true
  # Sound effects volume (0.0 to 1.0) — whoosh, pop, reveal synced to visual changes
  sfx_volume: 0.6
  # Beat sync: align visual transitions to voiceover rhythm cues marked with [beat]
  beat_sync: true

# AI image generation (optional, requires Replicate API token)
# Uses Flux Schnell via Replicate — ~$0.003 per image, ~2-4s per generation
images:
  # Replicate model: "black-forest-labs/flux-schnell" (fast, cheap)
  # or "black-forest-labs/flux-1.1-pro" (best quality, ~$0.04/image)
  model: "black-forest-labs/flux-schnell"

# AI-generated cinematic overlays (optional, same API key as AI images)
# Adds atmospheric depth to slides: bokeh, light leaks, film grain, etc.
overlays:
  # Enable AI-generated cinematic overlays on top of slide backgrounds
  enabled: false
  # Cinematic style preset:
  #   auto            — picks best style per slide role (recommended)
  #   cinematic_bokeh — shallow DOF with beautiful bokeh orbs (85mm f/1.2)
  #   light_leak      — warm amber/orange film light leak from edges
  #   film_noir       — high contrast dramatic shadows, teal & orange grade
  #   volumetric_light — god rays, dust particles, atmospheric haze
  #   neon_glow       — cyberpunk neon reflections, electric blue/magenta
  #   golden_hour     — warm sunset lighting with lens flare
  #   film_grain      — authentic 35mm Kodak film texture
  style: "auto"

# Web image search (optional, for script-based video backgrounds)
# Searches Pexels (if API key set) or DuckDuckGo (no key) for relevant photos
image_search:
  # Number of search results to try per slide (downloads first that works)
  results_per_query: 5

# Output
output:
  directory: "./output"
